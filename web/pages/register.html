<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEAP — Register</title>
     <script>
        (function() {
            var theme = localStorage.getItem('neap-theme') || 'light';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/register.css">
</head>
<body>

    <!-- Theme Toggle -->
    <button class="theme-toggle theme-toggle-register" onclick="toggleTheme()" title="Toggle theme">
        <span id="theme-icon">🌙</span>
    </button>

    <div class="register-wrapper">

        <!-- Header -->
        <div class="register-header">
            <div class="register-logo">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
            </div>
            <h1>NEAP</h1>
            <p>Create your account</p>
        </div>

        <!-- Card -->
        <div class="register-card">
            <div class="register-form">

                <!-- Success Message -->
                <div id="success-msg" class="success-msg">
                    Account created successfully! <a href="login.html">Sign in</a>
                </div>

                <!-- Error Message -->
                <div id="error-msg" class="error-msg"></div>

                <!-- Username -->
                <div class="input-group">
                    <label for="username">Username</label>
                    <input
                        class="input"
                        type="text"
                        id="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                    />
                </div>

                <!-- Email -->
                <div class="input-group">
                    <label for="email">Email</label>
                    <input
                        class="input"
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                    />
                </div>

                <!-- Password -->
                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <input
                            class="input"
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            autocomplete="new-password"
                        />
                        <span class="input-icon" onclick="togglePassword()">👁</span>
                    </div>
                </div>

                <!-- Submit -->
                <button class="btn btn-primary btn-full" id="register-btn" onclick="handleRegister()">
                    Create account
                </button>

                <div class="divider">Already have an account?</div>

                <a href="login.html" class="btn btn-secondary btn-full">
                    Sign in
                </a>

            </div>
        </div>

        <div class="register-footer">
            CTeSP Cibersegurança · ISTEC Porto
        </div>

    </div>

    <script src="../js/app.js"></script>
    <script src="../js/register.js"></script>
</body>
</html>
