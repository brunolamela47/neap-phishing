    <nav class="sidebar-nav">

    <a href="analises.html" class="nav-item">

        <span class="nav-label">Análises</span>
    </a>
    <a href="logs.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        <span class="nav-label">Logs</span>
    </a>
    <a href="alerts.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
        <span class="nav-label">Alertas</span>

    <a href="account.html" class="nav-item">

   <div class="sidebar-footer">
    <div class="sidebar-user">
        <div class="user-avatar" id="user-avatar">A</div>
        <span class="user-name" id="user-name">Admin</span>
    </div>
    <button class="logout-btn" onclick="handleLogout()" title="Terminar sessão">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" width="18" height="18"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
</div>
</aside>

<!-- ─── Main ─── -->
<main class="main-content" id="main-content">

    <header class="topbar">
        <div class="topbar-left">
            <button class="menu-toggle" onclick="toggleSidebar()">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" width="20" height="20"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <div>
                <h2 class="page-title">Análises</h2>
                <p class="page-subtitle">All phishing analysis results</p>
            </div>
        </div>
        <div class="topbar-right">
            <div class="filter-group">
                <button class="filter-btn active" onclick="filterByRisk(this, 'ALL')">All</button>
                <button class="filter-btn" onclick="filterByRisk(this, 'LOW')">Low</button>
                <button class="filter-btn" onclick="filterByRisk(this, 'MEDIUM')">Medium</button>
                <button class="filter-btn" onclick="filterByRisk(this, 'HIGH')">High</button>
                <button class="filter-btn" onclick="filterByRisk(this, 'CRITICAL')">Critical</button>
            </div>
        </div>
    </header>

    <div class="content-wrapper">

        <!-- Stats Row -->
        <div class="analises-stats">
            <div class="stat-pill">
                <span class="stat-dot dot-green"></span>
                <span id="count-low">0</span> Low
            </div>
            <div class="stat-pill">
                <span class="stat-dot dot-yellow"></span>
                <span id="count-medium">0</span> Medium
            </div>
            <div class="stat-pill">
                <span class="stat-dot dot-orange"></span>
                <span id="count-high">0</span> High
            </div>
            <div class="stat-pill">
                <span class="stat-dot dot-red"></span>
                <span id="count-critical">0</span> Critical
            </div>
        </div>

        <!-- Table -->
        <div class="card">
            <div class="card-header">
                <h3>Analysis Results</h3>
                <input class="input search-input" type="text" placeholder="Search..." oninput="searchAnalises(this.value)"/>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Sender</th>
                            <th>Subject</th>
                            <th>Score</th>
                            <th>Heuristic</th>
                            <th>Auth Penalty</th>
                            <th>Risk</th>
                            <th>Result</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody id="analises-body">
                        <tr>
                            <td colspan="9" style="text-align:center;color:var(--text-muted);padding:32px;">No analyses yet</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</main>

<script src="../js/app.js"></script>
<script src="../js/analises.js"></script>
</body>
</html>
