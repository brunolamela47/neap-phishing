<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEAP — Network Email Anti-Phishing</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            animation: fadeIn 0.4s ease;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            background: var(--accent-soft);
            border-radius: var(--radius-md);
            margin-bottom: 1.5rem;
        }

        .logo svg {
            width: 28px;
            height: 28px;
            stroke: var(--accent);
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 6px;
            text-align: center;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            text-align: center;
        }

        .btn-group {
            display: flex;
            gap: 16px;
        }

        .btn-3d {
            position: relative;
            padding: 14px 40px;
            font-size: 0.95rem;
            font-weight: 500;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            border: none;
            border-radius: var(--radius-md);
            transition: transform 0.12s ease, box-shadow 0.12s ease;
            outline: none;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-3d-primary {
            background: var(--accent);
            color: #ffffff;
            box-shadow: 0 6px 0 var(--accent-hover), 0 8px 16px rgba(99,102,241,0.25);
        }

        .btn-3d-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 0 var(--accent-hover), 0 12px 20px rgba(99,102,241,0.3);
        }

        .btn-3d-primary:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 var(--accent-hover), 0 4px 8px rgba(99,102,241,0.2);
        }

        .btn-3d-secondary {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border);
            box-shadow: 0 6px 0 var(--border), 0 8px 16px rgba(0,0,0,0.06);
        }

        .btn-3d-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 0 var(--border), 0 12px 20px rgba(0,0,0,0.08);
        }

        .btn-3d-secondary:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 var(--border), 0 4px 8px rgba(0,0,0,0.04);
        }

        .version {
            margin-top: 2.5rem;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .theme-toggle-index {
            position: fixed;
            top: 16px;
            right: 16px;
        }
    </style>
</head>
<body>

    <!-- Theme Toggle -->
    <button class="theme-toggle theme-toggle-index" onclick="toggleTheme()" title="Toggle theme">
        <span id="theme-icon">🌙</span>
    </button>

    <!-- Logo -->
    <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
    </div>

    <h1>NEAP</h1>
    <p class="subtitle">Network Email Anti-Phishing</p>

    <!-- Buttons -->
    <div class="btn-group">
        <a href="pages/register.html" class="btn-3d btn-3d-secondary">Register</a>
        <a href="pages/login.html" class="btn-3d btn-3d-primary">Login</a>
    </div>

    <p class="version">v1.0.0 · CTeSP Cibersegurança · ISTEC Porto</p>

    <script src="js/app.js"></script>
</body>
</html>
